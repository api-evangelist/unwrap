    GraphQL API for fetching feedback entries and group taxonomy, batch-importing
    feedback, and building classification groups. Authenticated with a personal
    API key sent as an HTTP Bearer token, scoped to a single View (team). Paged
    with take/skip (max 100 entries per request); rate limited to 100 requests
    per token per minute.
