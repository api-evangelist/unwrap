aid: unwrap
name: Unwrap
description: >-
  Unwrap is an AI-powered customer intelligence platform, founded by ex-Amazon
  Alexa product leaders, that aggregates customer feedback from every channel
  (support tickets, surveys, app reviews, sales calls, social) and uses custom
  NLP to auto-tag, cluster and surface actionable product insights without
  manual analysis. It ships a GraphQL data API (Bearer API key) for fetching
  feedback entries and taxonomy, batch-importing feedback, and building groups,
  plus a read-only remote MCP server (OAuth 2.0) and a first-party Surveys
  mobile SDK for iOS and Android. Unwrap is SOC 2 Type II and GDPR compliant.
